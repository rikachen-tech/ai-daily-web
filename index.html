<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights - 硅谷资讯订阅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(29, 161, 242, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .marquee-container {
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes scroll-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .animate-scroll-left {
            animation: scroll-left 40s linear infinite;
        }

        .animate-scroll-right {
            animation: scroll-right 45s linear infinite;
        }

        .influencer-tag {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            white-space: nowrap;
        }

        .avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 验证码框特定样式 */
        .otp-input {
            width: 3rem;
            height: 4rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            transition: all 0.2s;
            outline: none;
        }

        .otp-input:focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4 py-12 md:px-6">
    <div class="glow top-[-100px] right-[-100px]"></div>
    <div class="glow bottom-[-100px] left-[-100px]"></div>

    <div class="max-w-4xl w-full text-center">
        <!-- 品牌标识 -->
        <div class="mb-8 flex justify-center">
            <div class="p-3 glass-card rounded-2xl">
                <i class="fab fa-x-twitter text-2xl text-white"></i>
            </div>
        </div>

        <h1 class="text-4xl md:text-7xl font-bold tracking-tight mb-6 py-2 leading-tight bg-clip-text text-transparent bg-gradient-to-b from-white via-white to-gray-500">
            AI Insights Daily
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl mb-12 font-light max-w-xl mx-auto leading-relaxed">
            “订阅来自 Silicon Valley 顶尖大脑的每日思考”
        </p>

        <!-- 无限滚动大佬展示区 -->
        <div class="marquee-container overflow-hidden mb-16 space-y-4">
            <div class="flex gap-4 animate-scroll-left w-max">
                <div class="flex gap-4" id="marquee-row-1"></div>
                <div class="flex gap-4" id="marquee-row-1-copy"></div>
            </div>
            <div class="flex gap-4 animate-scroll-right w-max">
                <div class="flex gap-4" id="marquee-row-2"></div>
                <div class="flex gap-4" id="marquee-row-2-copy"></div>
            </div>
        </div>

        <!-- 订阅区域 -->
        <div class="max-w-md mx-auto relative min-h-[140px]">
            <div id="step-1" class="glass-card p-1.5 rounded-2xl flex flex-col sm:flex-row gap-2 transition-all duration-300">
                <input type="email" id="email-input" placeholder="输入邮箱地址..." 
                       class="bg-transparent text-white px-6 py-4 rounded-xl flex-1 outline-none text-sm placeholder:text-gray-600">
                <button id="send-btn" class="btn-primary px-8 py-4 rounded-xl font-bold text-sm whitespace-nowrap">
                    免费开启订阅
                </button>
            </div>

            <!-- 步骤 2: 修复后的验证码输入 -->
            <div id="step-2" class="hidden glass-card p-6 rounded-2xl fade-in">
                <p class="text-xs text-gray-400 mb-6 text-center">验证码已发送至 <span id="target-email" class="text-white font-medium"></span></p>
                
                <div class="flex flex-col gap-6">
                    <!-- 6个独立输入框 -->
                    <div class="flex justify-between gap-2" id="otp-container">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="one-time-code">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" inputmode="numeric">
                    </div>

                    <button id="verify-btn" class="btn-primary w-full py-4 rounded-xl font-bold text-sm shadow-lg shadow-white/5">
                        确认激活订阅
                    </button>
                    
                    <button id="back-btn" class="text-gray-500 text-[10px] uppercase tracking-widest hover:text-white transition-colors">
                        返回修改邮箱
                    </button>
                </div>
            </div>
            
            <div id="msg-box" class="hidden mt-6 p-4 rounded-xl text-sm border"></div>
        </div>

        <div class="mt-20 flex items-center justify-center gap-6 text-gray-600 text-[10px] uppercase tracking-widest font-medium">
            <span>Silicon Valley Direct</span>
            <div class="w-1 h-1 bg-gray-800 rounded-full"></div>
            <span>Deep Insights</span>
            <div class="w-1 h-1 bg-gray-800 rounded-full"></div>
            <span>Daily Curation</span>
        </div>
    </div>

    <script>
        // 大佬名单配置
        const influencers = [
            { name: "Sam Altman", handle: "sama" },
            { name: "Andrej Karpathy", handle: "karpathy" },
            { name: "Yann LeCun", handle: "ylecun" },
            { name: "Demis Hassabis", handle: "demishassabis" },
            { name: "OpenAI", handle: "OpenAI" },
            { name: "Anthropic", handle: "AnthropicAI" },
            { name: "Greg Brockman", handle: "gdb" },
            { name: "Aravind Srinivas", handle: "AravSrinivas" },
            { name: "Mustafa Suleyman", handle: "mustafasuleyman" },
            { name: "The Rundown AI", handle: "therundownai" },
            { name: "Rowan Cheung", handle: "rowancheung" },
            { name: "Pete Huang", handle: "pete_huang" },
            { name: "TLDR", handle: "tldr" },
            { name: "Ben's Bites", handle: "bentossell" },
            { name: "Allie K. Miller", handle: "alliekmiller" },
            { name: "Jim Fan", handle: "DrJimFan" },
            { name: "LlamaIndex", handle: "llama_index" },
            { name: "Swyx", handle: "Swyx" },
            { name: "Greg Isenberg", handle: "gregisenberg" },
            { name: "Lenny Rachitsky", handle: "lennysan" },
            { name: "Josh Woodward", handle: "joshuwoodward" },
            { name: "Kevin Weil", handle: "kevinweil" },
            { name: "Peter Yang", handle: "petergyang" },
            { name: "Nan Yu", handle: "nanyu" },
            { name: "Mckay Wrigley", handle: "mckaywrigley" },
            { name: "Google Labs", handle: "googlelabs" },
            { name: "Amjad Masad", handle: "amjad" },
            { name: "Guillermo Rauch", handle: "rauchg" },
            { name: "Riley Brown", handle: "rileybrownai" },
            { name: "Aaron Levie", handle: "levie" },
            { name: "Garry Tan", handle: "garrytan" },
            { name: "Julie Zhuo", handle: "joulee" },
            { name: "Matt Turck", handle: "mattturck" }
        ];

        function populateMarquee() {
            const row1 = document.getElementById('marquee-row-1');
            const row2 = document.getElementById('marquee-row-2');
            const half = Math.ceil(influencers.length / 2);
            const group1 = influencers.slice(0, half);
            const group2 = influencers.slice(half);

            const createTag = (item) => `
                <div class="influencer-tag">
                    <img src="https://unavatar.io/twitter/${item.handle}" class="avatar-sm" alt="${item.name}" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=${item.handle}'">
                    <span class="text-xs font-medium text-gray-300">${item.name}</span>
                </div>
            `;

            row1.innerHTML = group1.map(createTag).join('');
            document.getElementById('marquee-row-1-copy').innerHTML = row1.innerHTML;
            row2.innerHTML = group2.map(createTag).join('');
            document.getElementById('marquee-row-2-copy').innerHTML = row2.innerHTML;
        }

        populateMarquee();

        // 订阅逻辑
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const sendBtn = document.getElementById('send-btn');
        const verifyBtn = document.getElementById('verify-btn');
        const backBtn = document.getElementById('back-btn');
        const emailInput = document.getElementById('email-input');
        const msgBox = document.getElementById('msg-box');
        const otpInputs = document.querySelectorAll('.otp-input');

        // 发送验证码
        sendBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            if (!email) {
                showMsg('请输入有效邮箱', 'error');
                return;
            }
            sendBtn.innerText = '正在发送...';
            setTimeout(() => {
                document.getElementById('target-email').innerText = email;
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                showMsg('✨ 验证码已发送至您的邮箱', 'success');
                // 聚焦第一个框
                otpInputs[0].focus();
            }, 1000);
        });

        // 验证码输入框交互逻辑
        otpInputs.forEach((input, index) => {
            // 输入自动跳到下一个
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            // 退格键跳回上一个
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // 粘贴支持
            input.addEventListener('paste', (e) => {
                const data = e.clipboardData.getData('text').trim();
                if (data.length === 6 && /^\d+$/.test(data)) {
                    data.split('').forEach((char, i) => {
                        if (otpInputs[i]) otpInputs[i].value = char;
                    });
                    otpInputs[5].focus();
                }
                e.preventDefault();
            });
        });

        // 验证激活
        verifyBtn.addEventListener('click', () => {
            const code = Array.from(otpInputs).map(i => i.value).join('');
            if (code.length < 6) {
                showMsg('请输入完整的 6 位验证码', 'error');
                return;
            }
            verifyBtn.innerText = '正在激活...';
            setTimeout(() => {
                showMsg('🎉 订阅成功！欢迎加入 AI Insights Daily', 'success');
                step2.innerHTML = `<div class="py-8 text-green-400 font-bold text-center">✨ 订阅成功！</div>`;
            }, 1500);
        });

        backBtn.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
            msgBox.classList.add('hidden');
        });

        function showMsg(text, type) {
            msgBox.innerText = text;
            msgBox.classList.remove('hidden', 'bg-green-500/10', 'text-green-400', 'bg-red-500/10', 'text-red-400');
            msgBox.classList.add(type === 'success' ? 'bg-green-500/10' : 'bg-red-500/10');
            msgBox.classList.add(type === 'success' ? 'text-green-400' : 'text-red-400');
        }
    </script>
</body>
</html>
